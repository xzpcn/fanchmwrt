name: Build FanchmWrt + sing-box-extended (Mi Router 3 Pro)

# 在本仓库（fanchmwrt 的 fork）里手动触发，产出已内置 sing-box-extended 的
# Xiaomi Mi Router 3 Pro 固件。构建方式：OpenWrt 的 lang/golang 交叉编译源码。
#
# 注意：mt7621 是 mipsel，sing-box-extended 的 Manager API / 管理面板用不了
# （with_manager 依赖 modernc.org/sqlite，它没有 mips 实现），本工作流只编译
# 协议特性那部分；面板相关步骤在 mips 上会自动跳过。

on:
  workflow_dispatch:
    inputs:
      extra_packages:
        description: "额外打包进固件的包名，空格分隔（可留空）"
        required: false
        type: string
        default: ""

concurrency:
  group: build-r3p-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h "$GITHUB_WORKSPACE"

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -yy --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget
          sudo apt-get clean

      - name: 安装 Node.js（仅当目标架构真的带管理面板时才需要）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 恢复缓存
        uses: actions/cache@v4
        with:
          path: |
            dl
            ~/.ccache
            ~/.npm
            ~/.cache/openwrt-go-build
          key: r3p-${{ runner.os }}-${{ hashFiles('version', 'feeds.conf.default', 'package/fcm/sing-box-extended/Makefile', '.github/config/fanchmwrt-r3p.config') }}
          restore-keys: |
            r3p-${{ runner.os }}-

      - name: 更新并安装 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          test -f feeds/packages/lang/golang/golang-package.mk || {
            echo "packages feed 不完整，缺少 golang-package.mk" >&2; exit 1; }

      - name: 检查 feed 里的 Go 版本
        run: |
          need=1.26.4   # sing-box-extended go.mod 里的 go 指令
          cd feeds/packages/lang/golang
          def="$(sed -n 's/^GO_DEFAULT_VERSION:=\([0-9.]*\)/\1/p' golang-values.mk 2>/dev/null | head -n1)"
          list=""
          for mk in $(printf '%s\n' golang*/Makefile golang-*/Makefile | sort -u); do
            [ -f "$mk" ] || continue
            mm="$(sed -n 's/^GO_VERSION_MAJOR_MINOR:=\([0-9.]*\)/\1/p' "$mk" | head -n1)"
            pp="$(sed -n 's/^GO_VERSION_PATCH:=\([0-9]*\)/\1/p' "$mk" | head -n1)"
            if [ -n "$mm" ]; then
              list="$list ${mm}.${pp:-0}"
            else
              list="$list $(sed -n 's/^PKG_VERSION:=\([0-9.]*\).*/\1/p' "$mk" | head -n1)"
            fi
          done
          echo "feed 里的 Go:$list（默认主线 ${def:-未声明}）"
          ver="$(printf '%s\n' $list | sort -V | tail -n1)"
          dver="$(printf '%s\n' $list | grep "^${def}\." | sort -V | tail -n1)"
          [ -n "$dver" ] && ver="$dver"
          if [ -z "$ver" ]; then
            echo "认不出 feed 的 Go 版本，跳过检查。"
            exit 0
          fi
          echo "本次将使用的 Go: $ver"
          if [ "$(printf '%s\n%s\n' "$ver" "$need" | sort -V | head -n1)" != "$need" ]; then
            echo "Go $ver 低于 $need，请把 feeds.conf.default 里的 packages 指向更新的 commit。" >&2
            exit 1
          fi

      - name: 生成 .config
        env:
          EXTRA_PACKAGES: ${{ inputs.extra_packages }}
        run: |
          cp .github/config/fanchmwrt-r3p.config .config
          for pkg in $EXTRA_PACKAGES; do
            echo "CONFIG_PACKAGE_$pkg=y" >> .config
          done
          cat >> .config <<EOF
          CONFIG_CCACHE=y
          CONFIG_GOLANG_BUILD_CACHE_DIR="$HOME/.cache/openwrt-go-build"
          EOF
          make defconfig
          grep -q '^CONFIG_PACKAGE_sing-box-extended=y$' .config || {
            echo "sing-box-extended 未被选中，检查 .github/config/fanchmwrt-r3p.config" >&2; exit 1; }
          grep -q '^CONFIG_BUILD_LOG=y$' .config || {
            echo "CONFIG_BUILD_LOG 没生效（多半是 CONFIG_DEVEL 没打开），排错会很痛苦" >&2; exit 1; }
          grep -E '^CONFIG_TARGET_.*DEVICE|^CONFIG_PACKAGE_sing-box-extended|^CONFIG_SING_BOX_EXTENDED|^CONFIG_DEVEL|^CONFIG_BUILD_LOG' .config

      - name: 确认 sing-box-extended 实际使用的构建 tag
        run: |
          # mt7621 = mipsel。with_manager 的存储层 modernc.org/sqlite 没有 mips
          # 实现（modernc.org/sqlite/lib 里只有 386/amd64/arm/arm64/loong64/
          # ppc64le/riscv64/s390x 的文件），所以包内 Makefile 会在 mips 上自动
          # 去掉 with_manager / with_admin_panel。这里把真实结果打出来，免得以后
          # 又出现“看不到原因的失败”。TOPDIR 必须显式传，rules.mk 靠它定位。
          make -C package/fcm/sing-box-extended TOPDIR="$PWD" show-tags || true
          tags="$(make -s -C package/fcm/sing-box-extended TOPDIR="$PWD" show-tags 2>/dev/null | sed -n 's/^GO_PKG_TAGS=//p')"
          echo "GO_PKG_TAGS=$tags"
          if [ -z "$tags" ]; then
            echo "取不到 GO_PKG_TAGS，跳过校验" >&2; exit 0
          fi
          case ",$tags," in
            *,with_manager,*)
              echo "::error::当前架构仍带 with_manager，mips 上必然编译失败"; exit 1 ;;
          esac

      - name: 下载源码包
        run: make -j"$(nproc)" download

      - name: 编译固件
        run: make -j"$(nproc)"

      - name: 编译失败时输出日志
        if: failure()
        run: |
          # 并行构建时控制台只剩一行 ERROR，真正的报错在 logs/ 下的按包日志里
          # （文件名由 include/subdir.mk 决定，这里用 find 匹配，不猜命名）。
          echo "===== 按包日志（logs/）====="
          if [ -d logs ]; then
            find logs -type f -name '*sing-box-extended*' | sort | while read -r f; do
              echo "===== $f ====="
              tail -n 300 "$f"
            done
          else
            echo "没有 logs/ 目录：CONFIG_DEVEL / CONFIG_BUILD_LOG 没生效，只能看下面的单线程重跑。"
          fi
          # 再单独重跑一次这个包：-j1 V=s 不写日志文件，报错直接进控制台。
          # clean 是为了让 Build/Prepare（分流规则下载、面板 npm 编译）重新执行，
          # 否则它会命中 stamp 被跳过。这一段必须无条件执行，所以上面不 exit 1。
          echo "===== make -j1 V=s package/fcm/sing-box-extended/{clean,compile} ====="
          make -j1 V=s package/fcm/sing-box-extended/{clean,compile} 2>&1 | tail -n 500 || true

      - name: 检查固件里确实带了 sing-box-extended
        run: |
          # OpenWrt 25.12 是 apk 系（package/system/apk），未必还生成 .ipk，
          # 所以先用 image 的 .manifest 判断包是否真的进了固件。
          manifest="$(find bin/targets/ramips/mt7621 -maxdepth 1 -name '*.manifest' -print | head -n1)"
          if [ -z "$manifest" ]; then
            echo "::error::没找到 image manifest"; exit 1
          fi
          echo "===== $manifest ====="
          grep -E 'sing-box' "$manifest" || {
            echo "::error::固件 manifest 里没有 sing-box-extended"; exit 1; }

          # 包文件本身（ipk 是 ar+tar，apk 是 tar.gz）——能读就顺手校验一次，
          # 读不出结构只告警，不阻断。
          pkg="$(find bin -type f \( -name 'sing-box-extended*.ipk' -o -name 'sing-box-extended*.apk' \) | head -n1)"
          echo "包文件: ${pkg:-未生成}"
          if [ -n "$pkg" ]; then
            du -h "$pkg"
            case "$pkg" in
              *.ipk)
                ar p "$pkg" data.tar.gz > "$RUNNER_TEMP/fcm-data.tar.gz" 2>/dev/null && \
                  tar -tzf "$RUNNER_TEMP/fcm-data.tar.gz" > "$RUNNER_TEMP/fcm-files.txt" || true ;;
              *.apk)
                tar -tzf "$pkg" > "$RUNNER_TEMP/fcm-files.txt" 2>/dev/null || true ;;
            esac
            if [ -s "$RUNNER_TEMP/fcm-files.txt" ]; then
              echo "===== 包内文件 ====="
              cat "$RUNNER_TEMP/fcm-files.txt"
              grep -qE '/usr/bin/sing-box$' "$RUNNER_TEMP/fcm-files.txt" || \
                echo "::warning::包里没看到 /usr/bin/sing-box"
              grep -qE '/usr/share/sing-box/geo/' "$RUNNER_TEMP/fcm-files.txt" || \
                echo "::warning::包里没看到 /usr/share/sing-box/geo 规则文件"
            fi
          fi

      - name: 整理产物
        run: |
          mkdir -p out
          find bin/targets/ramips/mt7621 -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.itb' -o -name '*.manifest' -o -name '*.json' \) \
            -exec cp -t out/ {} +
          find bin -type f \
            \( -name 'sing-box-extended*.ipk' -o -name 'sing-box-extended*.apk' \) \
            -exec cp -t out/ {} + 2>/dev/null || true
          cp .config out/fanchmwrt-r3p.config.used
          if [ -d logs ]; then tar -C . -czf out/build-logs.tar.gz logs; fi
          ( cd out && sha256sum * | grep -v sha256sums.txt > sha256sums.txt || true )
          ls -lh out

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-r3p-sing-box-extended-${{ github.sha }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
