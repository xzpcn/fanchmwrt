name: Sync fanchmwrt upstream (每日 04:00)

# 每天检查上游 fanchmwrt/fanchmwrt 有没有新提交，有就调用 GitHub 的
# merge-upstream 接口更新 fork（等价于网页上的 “Sync fork / Update branch”）。
# 全程只打 REST API，不 clone 这个 267MB 的仓库，几十秒就能跑完；
# 我们自己加的 package/fcm/sing-box-extended 和 .github 文件不会被覆盖。
#
# 顺带检查 shtorm-7/sing-box-extended 有无新 release，有就开一个改好
# PKG_VERSION / PKG_HASH 的 PR，由人确认后再合并。
#
# 注意
#   * Actions 的 cron 只认 UTC：0 20 * * * = 北京时间 04:00；想要 UTC 04:00
#     就写 "0 4 * * *"。计划任务被推迟十几到几十分钟是常态。
#   * 本文件必须在 fork 的默认分支上，schedule 才会触发。
#   * 建 PR 那一步用 GITHUB_TOKEN 时，仓库必须打开
#     Settings → Actions → General → Workflow permissions →
#     “Allow GitHub Actions to create and approve pull requests”，
#     否则会 403（GitHub Actions is not permitted to create or approve
#     pull requests），表现为：分支和提交都建好了、PR 却没有。
#     也可以配一个 fine-grained PAT 叫 BUILD_TOKEN（Contents=Write、
#     Pull requests=Write、Actions=Write）来绕开这个设置，并让同步后能联动
#     触发固件构建（GITHUB_TOKEN 产生的事件不会触发新 workflow）。

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只检查、只写报告，不做任何改动"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  UPSTREAM: fanchmwrt/fanchmwrt
  EXT_REPO: shtorm-7/sing-box-extended
  PKG_MAKEFILE: package/fcm/sing-box-extended/Makefile
  BUILD_WORKFLOW: build-fanchmwrt-r3p-singbox.yml

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 记录检查的分支
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "branch=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "## $GITHUB_REPOSITORY @ $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          if ! gh api "repos/$UPSTREAM/commits/$GITHUB_REF_NAME" --jq .sha >/dev/null 2>&1; then
            echo "::error::上游 $UPSTREAM 没有同名分支 $GITHUB_REF_NAME，请把本文件放到与上游一致的分支上。"
            exit 1
          fi

      - name: 与上游比较
        id: cmp
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.ctx.outputs.branch }}
        run: |
          fork_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq .sha)"
          up_sha="$(gh api "repos/$UPSTREAM/commits/$BRANCH" --jq .sha)"
          echo "fork_sha=$fork_sha" >> "$GITHUB_OUTPUT"
          # compare/本地...上游 的 ahead_by = 上游有、本地还没有的提交数
          diff_json="$(gh api "repos/$GITHUB_REPOSITORY/compare/$fork_sha...$up_sha")"
          behind="$(jq -r .ahead_by <<<"$diff_json")"
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "上游 ${up_sha:0:9}，本地 ${fork_sha:0:9}：**落后 $behind 个提交**" >> "$GITHUB_STEP_SUMMARY"
          [ "$behind" != "0" ] || exit 0
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 待拉取的上游提交" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.commits[:60][] | "- `" + (.sha[0:9]) + "` " + (.commit.message | split("\n")[0])' \
            <<<"$diff_json" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 其中影响构建的文件" >> "$GITHUB_STEP_SUMMARY"
          jq -r '[(.files // [])[] | .filename
                 | select(test("^(version|feeds\\.conf\\.default|include/target.mk|target/linux/ramips/)"))]
                 | if length == 0 then "（无）" else .[:30][] | "- " + . end' \
            <<<"$diff_json" >> "$GITHUB_STEP_SUMMARY"

      - name: 同步 fork
        if: steps.cmp.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.ctx.outputs.branch }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run：跳过同步。" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! out="$(gh api -X POST "repos/$GITHUB_REPOSITORY/merge-upstream" \
                       -f branch="$BRANCH" 2>&1)"; then
            if grep -q 'HTTP 409' <<<"$out"; then
              echo "::error::上游改动与本地提交冲突，merge-upstream 无法自动合并。"
              {
                echo ""
                echo "## 需要你手动处理"
                echo "上游改了和本仓库重叠的文件，请在本地 \`git merge\` 上游分支解决冲突后 push。"
                echo "对比页：<https://github.com/$GITHUB_REPOSITORY/compare/$BRANCH>"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::merge-upstream 失败：$out"
            fi
            exit 1
          fi
          msg="$(jq -r '"已同步：merge_type=" + (.merge_type // "?") + "，base_branch=" + (.base_branch // "?")' \
                   <<<"$out" 2>/dev/null || true)"
          printf '%s\n' "${msg:-已同步：$out}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 检查 sing-box-extended 新版本
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.ctx.outputs.branch }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          tag="$(gh api "repos/$EXT_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)"
          [ -n "$tag" ] || { echo "读不到 $EXT_REPO 的 release，跳过。" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          latest="${tag#v}"

          mk="$(gh api "repos/$GITHUB_REPOSITORY/contents/$PKG_MAKEFILE?ref=$BRANCH" 2>/dev/null || true)"
          [ -n "$mk" ] || {
            echo "::warning::$PKG_MAKEFILE 不在 $BRANCH 上，集成文件还没提交？跳过版本检查。"
            exit 0
          }
          mk_text="$(jq -r .content <<<"$mk" | base64 -d)"
          blob_sha="$(jq -r .sha <<<"$mk")"

          # 版本在 Makefile 里是拆成两段的（apk 的版本语法不允许 "-extended-" 进
          # PKG_VERSION，否则打包阶段会报 package version is invalid）：
          #   PKG_VERSION:=1.14.3
          #   PKG_EXTENDED_SUFFIX:=extended-2.7.3
          # 所以比较和替换都必须按两段来，不能把整条 tag 塞进 PKG_VERSION。
          cur_ver="$(sed -n 's/^PKG_VERSION:=\(.*\)$/\1/p' <<<"$mk_text")"
          cur_ext="$(sed -n 's/^PKG_EXTENDED_SUFFIX:=\(.*\)$/\1/p' <<<"$mk_text")"
          cur_rel="$(sed -n 's/^PKG_RELEASE:=\(.*\)$/\1/p' <<<"$mk_text")"
          cur="${cur_ver}${cur_ext:+-}${cur_ext}"

          latest_ver="${latest%%-*}"
          latest_ext="${latest#"$latest_ver"}"
          latest_ext="${latest_ext#-}"

          nb="bump/sing-box-extended-$latest"
          echo "本仓库 \`$cur\`，上游最新 release \`$latest\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$cur_ver" ] || [ "$cur" = "$latest" ]; then
            # 上一次可能死在建 PR 那步、留下同名分支；这里顺手清掉（dry run 不动）。
            stale_prs="1"
            if [ "$DRY_RUN" != "true" ]; then
              stale_prs="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
                           --jq "[.[] | select(.head.ref == \"$nb\")] | length")"
            fi
            if [ "$stale_prs" = "0" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$nb" >/dev/null 2>&1 || true
              echo "已是最新；顺手清理残留的升级分支 \`$nb\`（如果有）。" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "已是最新，不用动。" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          if [ -n "$latest_ver" ] && [ "$latest_ver" != "$cur_ver" ] \
             && [ "$(printf '%s\n%s\n' "$cur_ver" "$latest_ver" | sort -V | tail -n1)" = "$cur_ver" ]; then
            echo "本地数字版本更高（$cur_ver > $latest_ver），跳过。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$latest_ver" ] || [ -z "$latest_ext" ]; then
            echo "::error::$tag 不是 <数字>-<后缀> 的形式，这个脚本处理不了，需要人工改。"
            exit 1
          fi

          # 数字版本没变（只是扩展分支自己的 y.z 变了）时必须让 PKG_RELEASE 递增，
          # 否则 apk 认为 r1 < 现有 r5，路由器上不会把它当成升级包。
          if [ "$latest_ver" = "$cur_ver" ]; then
            new_rel="$(( ${cur_rel:-0} + 1 ))"
          else
            new_rel=1
          fi

          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
                   --jq "[.[] | select(.head.ref == \"$nb\")] | length")" != "0" ]; then
            echo "已有 \`$nb\` 的待合并 PR，跳过。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          tmp="$(mktemp)"
          if ! curl -sSfL -o "$tmp" "https://codeload.github.com/$EXT_REPO/tar.gz/refs/tags/$tag"; then
            rm -f "$tmp"
            echo "::error::下载 $tag 源码包失败，算不出 PKG_HASH"
            exit 1
          fi
          newhash="$(sha256sum "$tmp" | cut -d' ' -f1)"
          rm -f "$tmp"

          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run：发现新版本 $latest（当前 $cur），不建 PR。" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq .sha)"
          # 上一次如果死在建 PR 这步，同名分支会留在仓库里；先删掉再建，
          # 否则 git/refs 会 409、contents PUT 会 sha 不匹配。
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$nb" >/dev/null 2>&1 || true
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$nb" -f sha="$head_sha" >/dev/null

          new_text="$(sed -e "s|^PKG_VERSION:=.*|PKG_VERSION:=$latest_ver|" \
                          -e "s|^PKG_EXTENDED_SUFFIX:=.*|PKG_EXTENDED_SUFFIX:=$latest_ext|" \
                          -e "s|^PKG_HASH:=.*|PKG_HASH:=$newhash|" \
                          -e "s|^PKG_RELEASE:=.*|PKG_RELEASE:=$new_rel|" <<<"$mk_text")"
          grep -qx "PKG_VERSION:=$latest_ver" <<<"$new_text" &&
            grep -qx "PKG_EXTENDED_SUFFIX:=$latest_ext" <<<"$new_text" &&
            grep -qx "PKG_HASH:=$newhash" <<<"$new_text" || {
              echo "::error::替换后没找到预期的 PKG_VERSION / PKG_EXTENDED_SUFFIX / PKG_HASH 行，拒绝生成半成品 PR。"
              exit 1
            }
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$PKG_MAKEFILE" \
            -f branch="$nb" \
            -f message="sing-box-extended: bump to $latest" \
            -f content="$(base64 -w0 <<<"$new_text")" \
            -f sha="$blob_sha" >/dev/null

          pr_body="$(printf '%s\n\n%s\n' \
            "自动检查发现 \`$EXT_REPO\` 发布了 \`$tag\`（本仓库原为 \`$cur\`）。" \
            "已改 \`PKG_VERSION:=$latest_ver\`、\`PKG_EXTENDED_SUFFIX:=$latest_ext\`、\`PKG_HASH:=$newhash\`、\`PKG_RELEASE:=$new_rel\`。版本必须拆两段，apk 不接受 \`-extended-\` 出现在 PKG_VERSION 里；合并前请扫一眼 release notes 的 build tag 增减。")"
          if ! out="$(gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" \
                        -f title="sing-box-extended: bump to $latest" \
                        -f head="$nb" -f base="$BRANCH" \
                        -f body="$pr_body" 2>&1)"; then
            echo "::error::创建 PR 失败：$out"
            {
              echo ""
              echo "## PR 没建出来，但升级分支已经推好了"
              echo "分支 \`$nb\`，可以直接在网页上开 PR 合并："
              echo "<https://github.com/$GITHUB_REPOSITORY/compare/$BRANCH...$nb?expand=1>"
              echo ""
              echo "两种常见原因："
              echo "1. 仓库没允许 Actions 建 PR：Settings → Actions → General → Workflow permissions → 勾选 \"Allow GitHub Actions to create and approve pull requests\"。仓库默认是关的，这时 GITHUB_TOKEN 会 403。"
              echo "2. 配了 BUILD_TOKEN（fine-grained PAT）但没给 Pull requests: Read and write。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "已开版本升级 PR：$(jq -r .html_url <<<"$out")" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 同步后触发固件构建
        if: steps.cmp.outputs.behind != '0' && inputs.dry_run != true
        env:
          BRANCH: ${{ steps.ctx.outputs.branch }}
          TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "未配置 BUILD_TOKEN，跳过自动构建（GITHUB_TOKEN 产生的事件不会联动新 workflow）。" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! gh workflow run "$BUILD_WORKFLOW" --ref "$BRANCH" --token "$TOKEN" 2>&1 |
               tee -a "$GITHUB_STEP_SUMMARY"; then
            echo "::error::触发 $BUILD_WORKFLOW 失败，检查 BUILD_TOKEN 是否有 Actions: Write 权限。"
            exit 1
          fi
          echo "已触发 \`$BUILD_WORKFLOW\`。" >> "$GITHUB_STEP_SUMMARY"
